<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GLM 错峰钟</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>GLM 错峰钟</h1>
        <!-- 副标题与页脚的规则文字由 app.js 从 peak.js 的 RULES 生成，这里只留占位 -->
        <p class="subtitle" id="subtitle"></p>
      </header>

      <!-- ?now=… 假时钟 / 无效参数提示（在 testid 元素之外） -->
      <p class="clock-note" id="clock-note" hidden></p>

      <section class="card status-card" aria-label="当前状态" aria-live="polite">
        <p class="status" data-testid="status">加载中…</p>
      </section>

      <section class="card" aria-label="倒计时">
        <div class="countdown" data-testid="countdown" role="timer">
          <p class="countdown-label" data-testid="countdown-label"></p>
          <p class="countdown-value" data-testid="countdown-value">--:--:--</p>
        </div>
      </section>

      <section class="card" aria-label="下一次切换">
        <h2 class="card-title">下一次切换</h2>
        <p class="next-switch" data-testid="next-switch">…</p>
      </section>

      <!-- 一周时间表 + 时区选择；行内容由 app.js 生成 -->
      <section class="card" aria-label="一周时间表">
        <div class="week-head">
          <h2 class="card-title">一周时间表</h2>
          <div class="tz-picker">
            <label class="tz-label" for="tz-select">时区</label>
            <select
              class="tz-select"
              id="tz-select"
              data-testid="tz-select"
            ></select>
          </div>
        </div>
        <div class="week-table" data-testid="week-table"></div>
      </section>

      <footer class="footer">
        <p id="rule-note"></p>
        <noscript><p>需要启用 JavaScript 才能显示实时状态。</p></noscript>
      </footer>
    </main>
  </body>
</html>
